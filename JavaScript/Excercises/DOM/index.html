<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JavaScript-Exercise-DOM Manipulation</title>
    </head>
    <body>
        <h4>DOM Manipulation</h4>

        <h5>Exercise 7a: Change Text Content</h5>
        <div>
            <p id="text"></p>
            <button id="textChangeBtn">Click to change Text</button>
        </div>

        <h5>Exercise 7b: TO-DO List : Grocery Items</h5> 
        <div id="todo">
            <input id="todoIn" type="text" placeholder="Type items">
            <button id="addBtn"> Add to List</button>
            <ul id="todo_ul">
                <li>Milk</li>
            </ul>
        </div>

        <h5>Exercise 7c: Change Image</h5> 
        <div id="imageChange">
            <img src="https://www.apple.com/v/homepage/images/iphone-18-pro/a/hero_iphone_18_pro__fqe1motd0ymy_medium.jpg", alt="SampleImage">
            <button id="imgBtn">Change Image</button>
        </div>

        <h5>Exercise 7d: Login Form</h5> 
        <div>
            <form id="'loginForm">
                <label>Username:</label>
                <input type="text" id="usrname" placeholder="username"> 
                <p></p>
                <label>Password:</label>
                <input type="password" id="passwd" placeholder="password">
                <button id="loginBtn">Submit</button>
            </form>
            <p id="loginStatus"></p>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
