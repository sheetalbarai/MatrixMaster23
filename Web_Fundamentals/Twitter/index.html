<!DOCTYPE html>
<html lang="en">
    <head>
       <title>Twitter Sign-in page</title>
       <link rel="stylesheet" type="text/css" href="./style.css">
    </head>
    <body>
        <div class="main_container">
            <div class="sign_in_container">
                <div class="T_logo">
                    <p class="close_x">X</p>
                    <img src="./image/twitterBird.png" alt="TwitterLogo" id="twitter_logo">
                </div>
                <div class="H1"><h2>Sign in to Twitter</h2></div>
                <div class="brand_in">
                    <img src="./image/googleLogo.png" alt="GoogleLogo" id="google_logo">
                    <p>Sign in with Google</p>
                </div>
                <div class="brand_in" id="apple_in">
                    <img src="./image/appleLogo.png" alt="AppleLogo" id="apple_logo">
                    <p>Sign in with Apple</p>
                </div>
                <div class="seperator">
                    <div class="halfline">-</div>
                    <p>or</p> 
                    <div class="halfline">-</div>
                </div>
                <div class="input_box">
                    <p>Phone,email or username</p>
                </div>
                <div class="next">
                    <p>Next</p>
                </div>
                <div class="frget_passwd">
                    <p>Forgot password?</p>
                </div>
                <div class="new_account">
                    <p>Don't have account?</p>
                    <a href="#">Sign Up</a>
                </div>
            </div>
        </div>

    </body>
</html>
