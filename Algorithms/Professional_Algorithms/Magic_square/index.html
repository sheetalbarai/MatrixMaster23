<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Magic Square</title>
        <link rel="stylesheet" type="text/css" href="./style.css">
    </head>
    <body>
        <h1>Magic Square</h1>
        <p> Enter numbers from 1 to 9 in each box to check if its a magical square</p>
        <h6> Magic square means sum of all elements in 1 row or 1 column or diagonal is 15</h6>
        <div class="container">
            <form class="numForm">
                 <input type="number" id="num1" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num2" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num3" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num4" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num5" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num6" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num7" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num8" min="1" max="9" placeholder="1-9">
                 <input type="number" id="num9" min="1" max="9" placeholder="1-9">
                 <button class="check">Is Magic Square?</button>
            </form>
            <p class="result"></p>
        </div>
 
    </body>
</html>
