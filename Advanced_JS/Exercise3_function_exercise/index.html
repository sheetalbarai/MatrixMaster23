<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Advanced JS - Exercise 3 - Function Exercise</title>
        <link rel="stylesheet" src="./style.css">
    </head>
    <body>
        <h3> Advanced JS- Function Exercise</h3>
      
        <h4 style="color:blue"> Exercise 1- Check Age</h4>
        <form>
            <input type="number" id="num1" placeholder="Enter Age">
            <button id="ageBtn">Enter</button>
        </form>
        <p id="check_age_output"></p>
       
        <h4 style="color:blue"> Exercise 2- Calculate Power of number e.g. X<sup>Y</sup>;</h4>
        <form>
            <input type="number" id="num1_2" placeholder="Enter X">
            <input type="number" id="num2_2" placeholder="Enter Y">
            <button id="powBtn">Enter</button>
        </form>
        <p id="power_output"></p>
            
        <h4 style="color:blue"> Exercise 3-Ask a question</h4>
        <button id="ask_que">Click Me!</button>

        <h4 style="color:blue"> Exercise 4- Addition & Multiplication of 2 numbers</h4>
        <button id="calculator">Enter numbers</button>
         
        <h4 style="color:blue"> Exercise 5- Minimum of 2 numbers</h4>
        <button id="minBtn" >Enter Numbers</button>
            
        <script src="./script.js"></script>
    </body>
</html>
